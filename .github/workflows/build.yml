
name: Build Lavender Cat Keyboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.yml'
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip "Teclado de gato lavanda_AndroidStudio.zip" -d proyecto

      - name: Compilar teclado
        working-directory: proyecto
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: teclado-lavanda-apk
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk

